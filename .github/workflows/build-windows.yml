name: Build Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller

      - name: Build exe
        run: pyinstaller desktop_dancer.spec

      - name: Smoke-test (just check the exe exists and is non-empty)
        shell: pwsh
        run: |
          $exe = "dist/desktop-dancer.exe"
          if (-not (Test-Path $exe)) { throw "exe not built" }
          if ((Get-Item $exe).Length -lt 1000000) { throw "exe suspiciously small" }
          Write-Host "OK $((Get-Item $exe).Length / 1MB) MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dancer-windows
          path: dist/desktop-dancer.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/desktop-dancer.exe
          generate_release_notes: true
